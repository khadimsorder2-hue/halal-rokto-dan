<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#B3261E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>হালাল রক্ত দান</title>
<link rel="stylesheet" href="fonts/noto-fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ═══════════ SPLASH OVERLAY ═══════════ -->
<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-inner">
    <div class="splash-logo">
      <svg viewBox="0 0 108 108" width="88" height="88">
        <defs>
          <linearGradient id="spg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#E6534B"/><stop offset="1" stop-color="#9E1710"/>
          </linearGradient>
        </defs>
        <path d="M54 26 C54 26 33 55 33 69 a21 21 0 1 0 42 0 C75 55 54 26 54 26 Z" fill="url(#spg)"/>
        <path d="M54 32 C54 32 37 57 37 69 a17 17 0 0 0 34 0 C71 57 54 32 54 32 Z" fill="#FFF" opacity=".14"/>
        <path d="M47 63 h5 v-5 a2 2 0 0 1 4 0 v5 h5 a2 2 0 0 1 0 4 h-5 v5 a2 2 0 0 1-4 0 v-5 h-5 a2 2 0 0 1 0-4 Z" fill="#FFF"/>
      </svg>
    </div>
    <h1 class="splash-title">হালাল রক্ত দান</h1>
    <p class="splash-sub">রক্ত দিন, জীবন বাঁচান</p>
    <div class="splash-org">
      <span>হিজলি দিঘাপাড়া যুব সংঘ</span>
      <span class="splash-org-meta">Since ২০২৬ • বাগাতিপাড়া, নাটোর</span>
    </div>
  </div>
  <div class="splash-loader"><span></span></div>
</div>

<!-- ═══════════ APP ROOT ═══════════ -->
<div id="app" class="app" hidden>
  <div id="screens" class="screens"></div>

  <!-- Top App Bar (rendered per-screen for flexibility) -->
  <!-- Bottom Navigation -->
  <nav id="bottomnav" class="bottomnav" hidden>
    <button class="bn-item" data-nav="home" aria-label="হোম">
      <span class="bn-ico" data-icon="home"></span><span class="bn-label">হোম</span>
    </button>
    <button class="bn-item" data-nav="stock" aria-label="রক্তের স্টক">
      <span class="bn-ico" data-icon="drop"></span><span class="bn-label">স্টক</span>
    </button>
    <button class="bn-item bn-center" data-nav="emergency" aria-label="জরুরি আবেদন">
      <span class="bn-ico bn-center-ico" data-icon="sos"></span><span class="bn-label">জরুরি</span>
    </button>
    <button class="bn-item" data-nav="donors" aria-label="ডোনার">
      <span class="bn-ico" data-icon="people"></span><span class="bn-label">ডোনার</span>
    </button>
    <button class="bn-item" data-nav="more" aria-label="আরও">
      <span class="bn-ico bn-badge-holder" data-icon="grid"></span><span class="bn-label">আরও</span>
    </button>
  </nav>

  <!-- Sheets / dialogs layer -->
  <div id="overlay-root"></div>
  <!-- Toast layer -->
  <div id="toast-root" class="toast-root"></div>
</div>

<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/screens.js"></script>
<script src="js/screens2.js"></script>
<script src="js/screens3.js"></script>
<script src="js/main.js"></script>
</body>
</html>
